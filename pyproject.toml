[project]
name = "steel"
version = "0.1.0"
description = "Continuously learning crypto market model with a live web dashboard"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "httpx>=0.27",
    "playwright>=1.62.0",
    "transformers>=5.19.0",
    "pyjwt[crypto]>=2.8",
    "eth-account>=0.14.0",
    "msgpack>=1.2.3",
]

[project.scripts]
steel = "steel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steel"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
